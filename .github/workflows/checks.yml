# Runs every automatic check on each pull request and on main.
# All the real work is in scripts/check.sh, so the same checks run anywhere
# (docs/decisions/0001-one-check-script.md). This file only prepares the
# computer and posts the screenshots.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: All checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Remember compiled Rust libraries between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'server/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install the browser used by the tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run every check
        run: scripts/check.sh

      - name: Keep the screenshots for the pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: web/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  screenshots:
    name: Post screenshots
    needs: checks
    # Screenshots are the last step of the checks, so they exist only when
    # every check passed. Only for pull requests from this repository: others
    # can't be given permission to write, and their content is never trusted.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # One pull request at a time replaces the side branch, so two never clash.
    concurrency:
      group: pr-screenshots
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: screenshots

      - name: Publish the screenshots and comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/publish-screenshots.sh screenshots
