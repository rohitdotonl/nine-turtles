# Runs every automatic check on each pull request and on main.
# All the real work is in scripts/check.sh, so the same checks run anywhere
# (docs/decisions/0001-one-check-script.md). This file only prepares the
# computers, runs the script's parts side by side (decision 0065) and posts
# the screenshots.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documents skip the slow checks: nothing
  # they change can break the program or its tests (decision 0065). Changes
  # only to the website (and documents) skip the app's checks (decision 0066).
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.look.outputs.code }}
      app: ${{ steps.look.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Look for anything besides documents
        id: look
        run: .github/code-changed.sh "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

  # Runs for every change, documents too: a moved or renamed document must
  # not leave a link pointing nowhere.
  docs:
    name: Links between documents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check the links between documents
        run: scripts/check.sh docs

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run the frontend checks
        run: scripts/check.sh frontend

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Remember compiled Rust libraries between runs
        id: rust-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          # Cargo.toml too, because how the libraries are built is set there.
          key: rust-test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'server/Cargo.lock', 'server/Cargo.toml') }}
          restore-keys: |
            rust-test-${{ runner.os }}-

      - name: Run the Rust checks
        run: scripts/check.sh rust

      # Only the libraries are worth remembering: nine turtles itself is built
      # fresh every time. Leaving it out keeps the copy small and quick to fetch.
      - name: Keep only the libraries for next time
        if: steps.rust-cache.outputs.cache-hit != 'true'
        working-directory: server
        run: cargo clean --package nine-turtles

  browser:
    name: Browser tests (part ${{ matrix.shard }} of 6)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Let every part finish, so one failure shows every failing test.
      # Six parts, each on its own computer: one computer runs two tests at
      # a time at best, so more parts is what makes them finish sooner. With
      # four, the slowest part took about 5 minutes and held up every pull
      # request (decision 0114).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Remember compiled Rust libraries between runs
        id: rust-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          # Cargo.toml too, because how the libraries are built is set there.
          key: rust-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'server/Cargo.lock', 'server/Cargo.toml') }}
          restore-keys: |
            rust-release-${{ runner.os }}-

      # Kept until the web app's libraries change (Playwright among them),
      # rather than downloaded every time; a slow download sometimes took
      # over 3 minutes (decision 0114).
      - name: Remember the browser used by the tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install the browser used by the tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        env:
          NINE_TURTLES_SHARD: ${{ matrix.shard }}/6
        run: scripts/check.sh browser

      # A failed test's log names the step it stopped at, except when the test
      # ran out of its 30 seconds between steps. What its page showed then
      # (Playwright's error-context.md, whole, from "# Test info" on: the
      # lines above it are Playwright's note to an AI, not the project's) is
      # printed here, so the log alone says where it was. A part cancelled at
      # the job's own time limit prints nothing.
      - name: Show what each failed test's page showed
        if: failure()
        working-directory: web
        run: |
          for file in test-results/*/error-context.md; do
            [ -f "$file" ] || continue
            echo "::group::$file"
            sed -n '/^# Test info/,$p' "$file"
            echo
            echo "::endgroup::"
          done

      - name: Keep only the libraries for next time
        if: steps.rust-cache.outputs.cache-hit != 'true'
        working-directory: server
        run: cargo clean --release --package nine-turtles

      - name: Keep the screenshots for the pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.shard }}
          path: web/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  website:
    name: Website checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            website/package-lock.json

      # Kept until the web app's libraries change (Playwright among them),
      # rather than downloaded every time; a slow download sometimes took
      # over 3 minutes (decision 0114).
      - name: Remember the browser used by the tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install the browser used by the check
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the website checks
        run: scripts/check.sh website

  # The one check main requires. It passes only when every part above passed,
  # or was skipped because what changed can't affect it.
  checks:
    name: All checks
    needs: [changes, docs, frontend, rust, browser, website]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs.result }}
          CODE: ${{ needs.changes.outputs.code }}
          APP: ${{ needs.changes.outputs.app }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          BROWSER: ${{ needs.browser.result }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          echo "What changed: $CHANGES (code=$CODE, app=$APP)"
          echo "Documents: $DOCS, frontend: $FRONTEND, Rust: $RUST, browser: $BROWSER, website: $WEBSITE"
          # A part may be skipped only when what changed said to skip it.
          ok() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          [ "$CHANGES" = success ] && [ "$DOCS" = success ]
          ok "$FRONTEND" "$APP" && ok "$RUST" "$APP" && ok "$BROWSER" "$APP" && ok "$WEBSITE" "$CODE"

  screenshots:
    name: Post screenshots
    needs: [changes, checks]
    # Screenshots are taken by the browser tests, and posted only when every
    # check passed. Only for pull requests from this repository: others
    # can't be given permission to write, and their content is never trusted.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.checks.result == 'success'
      && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # One pull request at a time replaces the side branch, so two never clash.
    concurrency:
      group: pr-screenshots
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: screenshots

      - name: Publish the screenshots and comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/publish-screenshots.sh screenshots
