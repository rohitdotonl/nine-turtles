# Publishes the website (website/, built with Eleventy) to GitHub Pages at
# nineturtles.app whenever a merge into main changes it (decision 0066).
# The app itself is deployed separately, to Render, by image.yml.
# How the owner sets this up once: docs/operations/website-and-domain.md.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "web/public/fonts/**"
      - "web/public/icons/**"
      - ".github/workflows/website.yml"
  # Lets the owner publish it again by hand: Actions → Website → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  # Never stop a publish halfway; a newer merge simply waits its turn.
  cancel-in-progress: false

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_site

  publish:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
