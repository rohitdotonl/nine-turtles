# Checks every 15 minutes that the live nine turtles answers its status page.
# When it doesn't (after 5 tries, a minute apart), this run fails and GitHub
# emails the owner. No outside monitoring service (decision 0074).
# What to do when the email comes: docs/operations/health-check.md.

name: Health check

on:
  schedule:
    # Every 15 minutes, a few minutes past the quarter hour, when GitHub's
    # scheduler is less busy. GitHub may start a run a few minutes late.
    - cron: "4,19,34,49 * * * *"
  # Lets the owner run it by hand: Actions → Health check → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  # A slow run (the app restarting) finishes; the next one waits its turn.
  cancel-in-progress: false

jobs:
  check:
    name: Is nine turtles answering?
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Ask the status page
        run: scripts/health-check.sh https://app.nineturtles.app
