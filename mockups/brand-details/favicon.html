<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap">
<style>
body{margin:0;background:#f2f2f0;color:#141414;font:16px/1.5 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:48px 16px 96px;display:grid;gap:56px}
h1,h2{font-family:'Literata',Georgia,serif;font-weight:400;margin:0} h1{font-size:36px} h2{font-size:24px}
p{margin:0;color:#3c3c40;max-width:70ch}
.opt{display:grid;gap:16px}
.strips{display:grid;gap:10px}
.strip{display:flex;align-items:flex-end;gap:2px;padding:8px 8px 0;border-radius:10px 10px 0 0;font:13px/1 -apple-system,system-ui,sans-serif;width:520px;max-width:100%}
.tab{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px 8px 0 0;white-space:nowrap}
.tab svg{width:16px;height:16px;flex:none}
.lbl{font-size:13px;color:#5f5f64;margin-top:4px}
.big{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.big div{display:grid;gap:6px;justify-items:center;font-size:13px;color:#5f5f64}
.big .bg{padding:16px;border-radius:12px}
.big svg{width:64px;height:64px}
.pick{font-weight:600;color:#141414}
.row{display:flex;gap:28px;flex-wrap:wrap}
</style></head><body><div class="wrap">
<header style="display:grid;gap:10px"><h1>The tab icon</h1>
<p>The little picture in a browser tab, at its real size (16px), in three kinds of tab: a light browser, a dark browser, and the tricky one, where the Mac is set to light but the browser has a dark theme. The icon can only see the Mac's setting, not the tab's color.</p></header>
<div id="opts"></div>
</div>
<script>
// The single turtle (decided favicon drawing), and today's turtle as it is in web/public/icons/icon.svg.
const turtle = (ink, s=1, dx=0, dy=0) => `<g fill="${ink}" transform="translate(${dx} ${dy}) scale(${s})"><path d="M1 11 A5 6 0 0 1 11 11 Z"/><circle cx="13.4" cy="8.6" r="1.6"/></g>`;
const today = mac => { const [t,i] = mac==='dark' ? ['#121212','#E8E8E8'] : ['#FFFFFF','#141414'];
  return `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="${t}"/><g fill="${i}"><g transform="translate(46.60 50.85) scale(3.4)"><path d="M-9 3.5 A7.5 7.5 0 0 1 6 3.5 Z"/><circle cx="8.6" cy="0.6" r="2.4"/></g></g></svg>`; };
// B: always the app icon's black tile, the turtle filling most of it.
const black = () => `<svg viewBox="0 0 16 16"><rect width="16" height="16" rx="3.5" fill="#141414"/>${turtle('#EFEFF1', 0.86, 0.6, 1.3)}</svg>`;
// C: the turtle alone, as big as fits, dark or light by the Mac's setting.
const bare = mac => `<svg viewBox="0 0 16 16">${turtle(mac==='dark' ? '#EFEFF1' : '#141414', 1.06, -1.1, -0.2)}</svg>`;
const OPTS = [
  ['Today', 'A small turtle on a rounded square, white by day and near-black by night. The turtle fills about half the square, so at 16px it is a tiny smudge.', today],
  ['Safe, my pick: the black square, always', 'The app icon\'s black square with the light turtle filling most of it, whatever the Mac or browser is set to. It never vanishes, and it\'s a small copy of the app icon on a phone.', black],
  ['Bold: just the turtle', 'Nothing behind it, as big as it fits; dark when the Mac is light, light when the Mac is dark. Cleanest, but in the third tab it disappears.', bare],
];
const STRIPS = [
  ['Light browser', '#dedfe3', '#ffffff', '#c9cbd0', '#141414', 'light'],
  ['Dark browser (Mac set to dark)', '#2b2c30', '#1d1e21', '#36373b', '#eeeeee', 'dark'],
  ['Mac set to light, browser theme dark', '#2b2c30', '#1d1e21', '#36373b', '#eeeeee', 'light'],
];
document.getElementById('opts').innerHTML = OPTS.map(([name, words, draw], k) => `<section class="opt">
  <h2 class="${k===1?'pick':''}">${name}</h2><p>${words}</p>
  <div class="strips">${STRIPS.map(([l,bar,on,off,ink,mac]) => `<div><div class="strip" style="background:${bar};color:${ink}"><span class="tab" style="background:${off}">Mail</span><span class="tab" style="background:${on}">${draw(mac)}nine turtles</span><span class="tab" style="background:${off}">${'Weather'}</span></div><p class="lbl">${l}</p></div>`).join('')}</div>
  <div class="big">${STRIPS.map(([l,bar,on,off,ink,mac]) => `<div><span class="bg" style="background:${on}">${draw(mac)}</span>4 times bigger</div>`).join('')}</div>
</section>`).join('');
</script></body></html>
