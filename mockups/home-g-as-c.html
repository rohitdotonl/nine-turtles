<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nine turtles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap">
<style>
/* G set as C: the app's grey sidebar (248px, the app's own width) on the left holds the name and links; the words are centred in the white; the lead in the app's sans. Was G set as A: one size (20/32), one 32px grid, white and ink only. The column starts on grid column 5 at 1280px. */
:root { --paper: #ffffff; --ink: #141414; --ink2: #3c3c40; --side: #efeff1;
  --serif: 'Literata', Georgia, serif; --sans: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --paper: #121212; --ink: #e8e8e8; --ink2: #c4c4c6; --side: #232323; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--serif); font-size: 20px; line-height: 32px; -webkit-font-smoothing: antialiased; }
.col { width: min(488px, 100% - 40px); margin-left: max(20px, calc(50vw - 640px + 464px)); }
@media (max-width: 1100px) { .col { margin-left: auto; margin-right: auto; } }
body::before { content: ""; position: fixed; left: 0; top: 0; bottom: 0; width: 248px; background: var(--side); }
header.col { position: fixed; left: 32px; top: 0; width: 200px; margin: 0; display: block; padding-top: 32px; }
header.col nav { flex-direction: column; gap: 0; margin-top: 32px; line-height: 32px; }
@media (min-width: 1101px) { body main.col { padding-top: 352px; margin-left: calc(248px + (100vw - 248px - 488px) / 2); } }
.lead { font-family: var(--sans); font-size: 19px; }
@media (max-width: 1100px) { body::before { right: 0; bottom: auto; width: auto; height: 64px; } header.col { position: static; width: min(488px, 100% - 40px); margin: 0 auto; display: flex; align-items: baseline; height: 64px; padding-top: 16px; } header.col nav { flex-direction: row; gap: 24px; margin: 0 0 0 auto; } }
.wm { display: inline-flex; align-items: baseline; gap: 8px; font-weight: 600; color: var(--ink); text-decoration: none; margin-right: auto; }
.wm svg { width: 32px; height: 24px; transform: translateY(1px); }
nav { display: flex; gap: 28px; font-family: var(--sans); font-size: 16px; }
nav a { color: var(--ink2); text-decoration: none; }
nav a:hover { text-decoration: underline; }
main.col { padding-top: 256px; }
main p { margin: 0 0 32px; }
.lead { font-weight: 600; }
.btn { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 8px; background: var(--ink); color: var(--paper); font-family: var(--sans); font-weight: 600; font-size: 17px; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
@media (max-width: 700px) { main.col { padding-top: 128px; } }
</style>
</head>
<body>
<header class="col">
  <a class="wm" href="#" aria-label="nine turtles">

      <g transform="translate(47.7 46.7)"><path d="M-9 3.5 A7.5 7.5 0 0 1 6 3.5 Z"/><circle cx="8.6" cy="0.6" r="2"/></g>

      <g transform="translate(18.5 70.7)"><path d="M-9 3.5 A7.5 7.5 0 0 1 6 3.5 Z"/><circle cx="8.6" cy="0.6" r="2"/></g>

  <nav aria-label="Site"><a href="#">How it works</a><a href="#">Blog</a></nav>
</header>
<main class="col">
  <p class="lead">Read people. Write back.</p>
  <p>There are people online you'd like to know. Most of them have a blog, a newsletter or a channel. nine turtles keeps them in one quiet place, helps you write back to them, and ends when you've read what's there.</p>
  <a class="btn" href="#">Open the app</a>
</main>

</html>
