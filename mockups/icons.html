<title>nine turtles icons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Atkinson+Hyperlegible+Next:wght@400;500;600&display=swap">
<style>
/* Icon directions: today, A tidy line, B bold, C my pick. Each shown as the full set and in the app at real size. */
:root { --lit: 'Literata', Georgia, serif; --atk: 'Atkinson Hyperlegible Next', system-ui, sans-serif;

.night { --p:#121212; --l:#1a1a1a; --s:#232323; --i:#e8e8e8; --i2:#c4c4c6; --m:#a4a4a8; --a:#94b2e6; --x:#e39aa4; --pill:#323234; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: #141414; font-family: var(--atk); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 56px 16px 120px; display: grid; gap: 96px; }
h1, h2 { font-family: var(--lit); font-weight: 400; margin: 0; } h1 { font-size: 40px; line-height: 1.15; } h2 { font-size: 28px; }
p { margin: 0; color: #3c3c40; max-width: 70ch; }
section { display: grid; gap: 18px; }
.which { color: #5f5f64; font-size: 15px; }
.pick { border-top: 2px solid #141414; padding-top: 32px; }
.set { background: #fff; border-radius: 10px; box-shadow: 0 0 0 1px rgba(20,20,20,.12); padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 18px 8px; color: #141414; }
.set div { display: grid; justify-items: center; gap: 8px; font-size: 11.5px; color: #5f5f64; text-align: center; }
.set .big { display: flex; gap: 10px; align-items: center; }
.set .gone { opacity: .35; }
.ctx { display: grid; grid-template-columns: 256px 1fr 300px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(20,20,20,.12); background: var(--p); color: var(--i); min-height: 560px; }
@media (max-width: 900px) { .ctx { grid-template-columns: 1fr; } }
.sb { background: var(--s); padding: 16px 12px; }
.sb button, .bar button, .srow { font: inherit; color: inherit; background: none; border: 0; }
.nav { display: grid; gap: 2px; font-size: 15px; }
.nav span { min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; }
.nav .here { background: var(--pill); font-weight: 600; }
.nav .here svg { color: var(--i); }
.nav svg, .srow svg { color: var(--m); flex: none; }
.secn { margin: 18px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--m); }
.rd { padding: 0 0 24px; }
.bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: var(--i2); }
.bar div { display: flex; gap: 2px; }
.bar span { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; }
.rd h3 { font-family: var(--lit); font-size: 32px; line-height: 40px; font-weight: 600; margin: 16px 40px 0; }
.rd p { font-family: var(--lit); font-size: 19px; line-height: 32px; margin: 20px 40px 0; color: var(--i); }
.rd .by { font-family: var(--atk); font-size: 14px; color: var(--m); margin-top: 12px; }
.st { background: var(--l); padding: 12px 16px; border-left: 1px solid color-mix(in srgb, var(--i) 9%, transparent); }
.srow { display: flex; align-items: center; gap: 12px; padding: 0 4px; min-height: 36px; font-size: 14.5px; font-weight: 500; }
.srow.danger { color: var(--x); } .srow.danger svg { color: var(--x); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px 32px; }
.notes div { display: grid; gap: 4px; } .notes b { font-weight: 600; } .notes p { font-size: 15.5px; }
.toggle { display: flex; gap: 8px; }
.toggle button { font: inherit; font-size: 14px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #8a8a8f; background: #fff; cursor: pointer; }
.toggle [aria-pressed="true"] { background: #141414; color: #fff; border-color: #141414; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:12px;max-width:720px">
    <h1>Icons</h1>
    <p>nine turtles has about 50 small line icons: in the sidebar, above an article and down Settings' first page. Each direction is shown twice: the whole set, and in the app at its real size. Faded icons are the ones that direction removes.</p>
    <div class="toggle"><button aria-pressed="true" data-n="0">By day</button><button aria-pressed="false" data-n="1">By night</button></div>
  </header>
  <div id="out"></div>
</div>

 ['today','Where we are','Today', 1.5, 'One thin line on a 20 pixel grid. Mostly good, but some icons drift apart: two different envelopes, a clock and a history that look alike, circles and corners in slightly different sizes, and a few pictures (a robot, a heartbeat, a pen nib, a 9 in a ring) that tell you little.', null, []],
 ['A','1, the safe one','Tidy line', 1.5, 'The same thin line, made consistent: one circle size, one corner, one chevron, solid small dots. Three duplicates merge into one: mark unread and the Unread list share one sign, and Text size uses Aa.', [['What changes','Small fixes you feel more than see: arrows, the alert and the keyboard redrawn to match.'],['What stays','Every row in Settings keeps a picture, including the robot and the heartbeat.'],['The catch','Tidier, but the set still doesn\'t feel like it belongs to the nine turtles.']], ['unread','a-plus','nine-circle']],
 ['B','2, the bold one','Fewer, heavier, from the logo\'s shapes', 1.75, 'A slightly heavier line, the weight of Atkinson\'s medium letters, drawn only from circles, half-circles and straight lines: the logo\'s own shapes, with no turtle in them. And Settings\' rows lose their pictures entirely, because their names already say it.', [['What changes','The interface feels a touch firmer. Settings becomes a quiet list of words, like a book\'s contents page.'],['What it costs','It reverses a choice made in October (pictures on Settings\' rows), so it needs your yes.'],['The catch','The heavier line is a little louder beside the reading text.']], ['unread','a-plus','nine-circle','book','clock','sort','palette','pen-nib','feed','heart-pulse','panel-dots','bookmark-plus','newspaper','plug','robot','key','people','card','envelope']],

  <div class="ctx ${night?'night':''}">
    <div class="sb"><div class="nav"><span class="here">${svg(k,'dot',18,sw)}Unread</span><span>${svg(k,'star',18,sw)}Starred</span><span>${svg(k,'stack',18,sw)}All articles</span><span>${svg(k,'history',18,sw)}Recently read</span></div>
      <div class="secn">Collections</div><div class="nav"><span>${svg(k,'shelf',18,sw)}To read slowly</span><span>${svg(k,'search',18,sw)}bicycles</span></div>
      <div class="secn">Podcasts</div><div class="nav"><span>${svg(k,'queue',18,sw)}Up Next</span><span>${svg(k,'headphones',18,sw)}Field Recordings</span></div>
      <div class="nav" style="margin-top:18px"><span>${svg(k,'settings',18,sw)}Settings</span></div></div>
    <div class="rd"><div class="bar"><div><span>${svg(k,'back',20,sw)}</span><span>${svg(k,'sidebar',20,sw)}</span></div><div><span>${svg(k,'aa',20,sw)}</span><span>${svg(k,'star',20,sw,true)}</span><span>${svg(k,'open',20,sw)}</span><span>${svg(k,'share',20,sw)}</span><span>${svg(k,'more',20,sw)}</span></div></div>
      <h3>The year I stopped mending my bicycle myself</h3><p class="by">Mira Okonkwo-Lind, Hedgerow Notes</p><p>For eleven winters I kept a tin of spare spokes by the back door and a printed chart of tyre pressures taped inside the cupboard.</p>
      <p style="display:flex;gap:8px;align-items:center;font-family:var(--atk);font-size:14px;color:var(--x)">${svg(k,'alert',16,sw)}An error looks like this, always with words.</p></div>
    <div class="st"><div class="secn" style="margin:6px 4px 8px">Settings</div>${ROWS.map(([n,l]) => `<div class="srow ${n==='trash'?'danger':''}">${k==='B'&&n!=='trash'?'':svg(k,n,18,sw)}${l}</div>`).join('')}</div>
  </div>
  ${notes?`<div class="notes">${notes.map(([b,t])=>`<div><b>${b}</b><p>${t}</p></div>`).join('')}</div>`:''}
  </section>`).join('');
}
draw(false);
document.querySelectorAll('.toggle button').forEach(b => b.onclick = () => { document.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', x===b)); draw(b.dataset.n==='1'); });
</script>
</body>
</html>
