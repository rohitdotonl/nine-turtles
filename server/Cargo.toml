[package]
name = "nine-turtles"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Every library here must be on the approved list in docs/libraries.md;
# scripts/check-libraries.mjs fails the checks otherwise.
[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "set-header"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
argon2 = "0.6.0"
getrandom = "0.4.3"
blake2 = "0.11.0"
# Checking that WebSub deliveries really come from the hub (decision 0069).
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# No "system-proxy": nine turtles talks to publishers directly, whatever the host sets.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "http2", "gzip", "brotli", "deflate", "stream"] }
feed-rs = "3.0"
scraper = "0.29"
opml = "1.1"
ammonia = "4.2"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
# Reading newsletter emails (decision 0091). "full_encoding" reads Chinese and
# Japanese emails too, with encoding_rs, which reqwest already brings.
mail-parser = { version = "1.0.0", features = ["full_encoding"] }
# Passkey sign-in (decision 0109): checks the browser's WebAuthn answers.
# "conditional-ui" lets a passkey sign in without an email typed first (the
# browser's passkey autofill, and Sign in with a passkey).
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }

[dev-dependencies]
# The same project's software passkey, so the tests can add a passkey and
# sign in with it without a real device.
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
