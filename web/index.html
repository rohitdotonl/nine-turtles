    <script>/* The page the reader chose on this device from the first moment, so Paper or Night never opens white; after a second, "Opening your reading…" (decision 0260). The home-screen app's launch screen and the page before the styles arrive take that page's color too (decision 0321). Its hash is in server/src/security.rs; src/lib/preferences.ts does the rest. */try{var p=JSON.parse(localStorage.getItem("nine-turtles.preferences")||"null");p=p&&p.page;var l={white:["light","#FFFFFF"],paper:["light","#F7F3EA"],night:["dark","#121212"]}[p];var r=document.documentElement;if(l){r.dataset.theme=p;r.dataset.mode=l[0];document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=l[1]});document.querySelector('meta[name="color-scheme"]').content=l[0]}var t=l?p:matchMedia("(prefers-color-scheme: dark)").matches?"night":"white";document.querySelector('link[rel="manifest"]').href=t=="white"?"/manifest.webmanifest":"/manifest-"+t+".webmanifest";document.querySelectorAll('link[rel="apple-touch-startup-image"]').forEach(function(k){k.href=k.getAttribute("href").replace(/[a-z]+(\/[0-9x]+\.png)$/,t+"$1")})}catch(e){}setTimeout(function(){var o=document.getElementById("opening");if(o)o.hidden=false},1000)</script>
    <script>/* Asks for what the first screen needs while the app's code is still on its way: who is signed in, their settings, everyone they follow, and the list this address opened last time (decision 0320). Its hash is in server/src/security.rs; src/lib/early.ts does the rest. */try{var a={},e=JSON.parse(localStorage.getItem("nine-turtles.early")||"null")||{};["/api/session","/api/settings","/api/feeds",e[location.pathname]].forEach(function(u){if(typeof u=="string"&&u.indexOf("/api/")==0){var f=fetch(u,{cache:"no-store"});f.catch(function(){});a[u]=f}});window.nineTurtlesEarly=a}catch(x){}</script>

    <script type="module" src="/src/main.ts"></script>
