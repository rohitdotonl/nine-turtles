<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>nine turtles</title>
    <!-- Adding nine turtles to a phone's home screen (SPEC section 20). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="nine turtles" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/literata-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/atkinson-hyperlegible-next-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>/* The page the reader chose on this device from the first moment, so Paper or Night never opens white; after a second, "Opening your reading…" (decision 0260). Its hash is in server/src/security.rs; src/lib/preferences.ts does the rest. */try{var p=JSON.parse(localStorage.getItem("nine-turtles.preferences")||"null");p=p&&p.page;var l={white:["light","#FFFFFF"],paper:["light","#F7F3EA"],night:["dark","#121212"]}[p];if(l){var r=document.documentElement;r.dataset.theme=p;r.dataset.mode=l[0];document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=l[1]})}}catch(e){}setTimeout(function(){var o=document.getElementById("opening");if(o)o.hidden=false},1000)</script>
  </head>
  <body>
    <div id="app"><p id="opening" class="opening" role="status" hidden>Opening your reading…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
