<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- The server writes its version here, so the app knows its own even when opened from the kept copy (decision 0320). -->
    <meta name="nine-turtles-version" content="" />
    <title>nine turtles</title>
    <!-- A shared link to the app shows the website's share picture (decision 0316; the website's is decision 0142). -->
    <meta name="description" content="Read people. Write back." />
    <meta property="og:site_name" content="nine turtles" />
    <meta property="og:title" content="nine turtles" />
    <meta property="og:description" content="Read people. Write back." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://nineturtles.app/images/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="nine turtles: Read people. Write back." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Adding nine turtles to a phone's home screen (SPEC section 20). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="nine turtles" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/literata-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/atkinson-hyperlegible-next-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>/* The page the reader chose on this device from the first moment, so Paper or Night never opens white; after a second, "Opening your reading…" (decision 0260). Its hash is in server/src/security.rs; src/lib/preferences.ts does the rest. */try{var p=JSON.parse(localStorage.getItem("nine-turtles.preferences")||"null");p=p&&p.page;var l={white:["light","#FFFFFF"],paper:["light","#F7F3EA"],night:["dark","#121212"]}[p];if(l){var r=document.documentElement;r.dataset.theme=p;r.dataset.mode=l[0];document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=l[1]})}}catch(e){}setTimeout(function(){var o=document.getElementById("opening");if(o)o.hidden=false},1000)</script>
    <script>/* Asks for what the first screen needs while the app's code is still on its way: who is signed in, their settings, everyone they follow, and the list this address opened last time (decision 0320). Its hash is in server/src/security.rs; src/lib/early.ts does the rest. */try{var a={},e=JSON.parse(localStorage.getItem("nine-turtles.early")||"null")||{};["/api/session","/api/settings","/api/feeds",e[location.pathname]].forEach(function(u){if(typeof u=="string"&&u.indexOf("/api/")==0){var f=fetch(u,{cache:"no-store"});f.catch(function(){});a[u]=f}});window.nineTurtlesEarly=a}catch(x){}</script>
  </head>
  <body>
    <div id="app"><p id="opening" class="opening" role="status" hidden>Opening your reading…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
